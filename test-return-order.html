<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试退货订单创建</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
        }
        .section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #0056b3;
        }
        pre {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
        }
        .error {
            color: red;
        }
        .success {
            color: green;
        }
    </style>
</head>
<body>
    <h1>退货订单创建测试工具</h1>

    <div class="section">
        <h2>测试说明</h2>
        <p>这个工具用于测试退货订单创建 API。请确保：</p>
        <ul>
            <li>已经登录系统</li>
            <li>有有效的销售订单数据</li>
            <li>打开浏览器开发者工具查看详细日志</li>
        </ul>
    </div>

    <div class="section">
        <h2>单订单模式测试</h2>
        <button onclick="testSingleOrderMode()">测试单订单退货</button>
    </div>

    <div class="section">
        <h2>多订单模式测试</h2>
        <button onclick="testMultiOrderMode()">测试多订单退货</button>
    </div>

    <div class="section">
        <h2>测试结果</h2>
        <div id="result"></div>
    </div>

    <script>
        function displayResult(title, data, isError = false) {
            const resultDiv = document.getElementById('result');
            const className = isError ? 'error' : 'success';
            resultDiv.innerHTML = `
                <h3 class="${className}">${title}</h3>
                <pre>${JSON.stringify(data, null, 2)}</pre>
            `;
        }

        async function testSingleOrderMode() {
            console.log('=== 测试单订单模式 ===');

            const testData = {
                returnMode: 'single_order',
                salesOrderId: 'test-sales-order-id', // 需要替换为真实的销售订单ID
                customerId: 'test-customer-id', // 需要替换为真实的客户ID
                type: 'quality_issue',
                processType: 'refund',
                reason: '测试退货原因',
                remarks: '这是一个测试',
                items: [
                    {
                        salesOrderItemId: 'test-item-id', // 需要替换为真实的明细ID
                        productId: 'test-product-id', // 需要替换为真实的产品ID
                        returnQuantity: 1,
                        originalQuantity: 10,
                        unitPrice: 100,
                        subtotal: 100,
                        condition: 'good'
                    }
                ]
            };

            console.log('发送数据:', testData);

            try {
                const response = await fetch('/api/return-orders', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(testData),
                });

                const data = await response.json();
                console.log('响应数据:', data);

                if (response.ok) {
                    displayResult('✅ 创建成功', data);
                } else {
                    displayResult('❌ 创建失败', data, true);
                }
            } catch (error) {
                console.error('请求失败:', error);
                displayResult('❌ 请求错误', { error: error.message }, true);
            }
        }

        async function testMultiOrderMode() {
            console.log('=== 测试多订单模式 ===');

            const testData = {
                returnMode: 'multi_order',
                salesOrderId: null,
                customerId: 'test-customer-id', // 需要替换为真实的客户ID
                type: 'quality_issue',
                processType: 'refund',
                reason: '测试多订单退货',
                remarks: '这是一个多订单测试',
                items: [
                    {
                        salesOrderItemId: 'test-item-id-1', // 需要替换为真实的明细ID
                        productId: 'test-product-id-1', // 需要替换为真实的产品ID
                        returnQuantity: 1,
                        originalQuantity: 10,
                        unitPrice: 100,
                        subtotal: 100,
                        condition: 'good'
                    }
                ]
            };

            console.log('发送数据:', testData);

            try {
                const response = await fetch('/api/return-orders', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(testData),
                });

                const data = await response.json();
                console.log('响应数据:', data);

                if (response.ok) {
                    displayResult('✅ 创建成功', data);
                } else {
                    displayResult('❌ 创建失败', data, true);
                }
            } catch (error) {
                console.error('请求失败:', error);
                displayResult('❌ 请求错误', { error: error.message }, true);
                }
        }

        console.log('测试工具已加载。请点击按钮开始测试。');
        console.log('注意：需要先在表单页面选择真实的销售订单，然后从控制台复制真实的ID');
    </script>
</body>
</html>
