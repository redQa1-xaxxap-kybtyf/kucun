<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Session 调试工具</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        padding: 20px;
        background: #f5f5f5;
      }

      .container {
        max-width: 800px;
        margin: 0 auto;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        padding: 30px;
      }

      h1 {
        color: #333;
        margin-bottom: 20px;
        border-bottom: 3px solid #4caf50;
        padding-bottom: 10px;
      }

      .section {
        margin: 20px 0;
        padding: 15px;
        background: #f9f9f9;
        border-radius: 4px;
        border-left: 4px solid #2196f3;
      }

      .section h2 {
        color: #2196f3;
        margin-bottom: 10px;
        font-size: 18px;
      }

      button {
        background: #4caf50;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
        margin: 5px;
        transition: background 0.3s;
      }

      button:hover {
        background: #45a049;
      }

      button:disabled {
        background: #ccc;
        cursor: not-allowed;
      }

      .result {
        margin-top: 15px;
        padding: 15px;
        background: white;
        border-radius: 4px;
        border: 1px solid #ddd;
      }

      .success {
        color: #4caf50;
        font-weight: bold;
      }

      .error {
        color: #f44336;
        font-weight: bold;
      }

      .warning {
        color: #ff9800;
        font-weight: bold;
      }

      pre {
        background: #263238;
        color: #aed581;
        padding: 15px;
        border-radius: 4px;
        overflow-x: auto;
        font-size: 13px;
        line-height: 1.5;
      }

      .status-badge {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: bold;
        margin-left: 10px;
      }

      .status-success {
        background: #4caf50;
        color: white;
      }

      .status-error {
        background: #f44336;
        color: white;
      }

      .status-warning {
        background: #ff9800;
        color: white;
      }

      .info-box {
        background: #e3f2fd;
        border-left: 4px solid #2196f3;
        padding: 15px;
        margin: 15px 0;
        border-radius: 4px;
      }

      .info-box h3 {
        color: #1976d2;
        margin-bottom: 10px;
      }

      .info-box ul {
        margin-left: 20px;
      }

      .info-box li {
        margin: 5px 0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🐛 Session 调试工具</h1>

      <div class="info-box">
        <h3>📋 使用说明</h3>
        <ul>
          <li>点击"检查 Session"按钮查看当前登录状态</li>
          <li>点击"测试权限检查"验证权限系统是否正常</li>
          <li>查看结果中的详细信息,诊断问题</li>
        </ul>
      </div>

      <div class="section">
        <h2>1️⃣ Session 检查</h2>
        <button onclick="checkSession()">检查 Session</button>
        <div id="sessionResult" class="result" style="display: none"></div>
      </div>

      <div class="section">
        <h2>2️⃣ 权限检查</h2>
        <button onclick="testPermissions()">测试权限检查</button>
        <div id="permissionResult" class="result" style="display: none"></div>
      </div>

      <div class="section">
        <h2>3️⃣ 诊断建议</h2>
        <div id="diagnostics" class="result" style="display: none"></div>
      </div>
    </div>

    <script>
      async function checkSession() {
        const resultDiv = document.getElementById('sessionResult');
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = '<p>⏳ 正在检查...</p>';

        try {
          const response = await fetch('/api/auth/session');
          const session = await response.json();

          let html = '<h3>Session 数据:</h3>';

          if (!session || !session.user) {
            html += '<p class="error">❌ 未登录或 Session 无效</p>';
            html += '<p>请先登录系统: <a href="/auth/signin">点击登录</a></p>';
          } else {
            html += '<p class="success">✅ Session 有效</p>';
            html += '<table style="width: 100%; margin-top: 10px;">';
            html +=
              '<tr><td><strong>用户 ID:</strong></td><td>' +
              (session.user.id || '❌ 未设置') +
              '</td></tr>';
            html +=
              '<tr><td><strong>用户名:</strong></td><td>' +
              (session.user.username || '❌ 未设置') +
              '</td></tr>';
            html +=
              '<tr><td><strong>邮箱:</strong></td><td>' +
              (session.user.email || '❌ 未设置') +
              '</td></tr>';
            html +=
              '<tr><td><strong>姓名:</strong></td><td>' +
              (session.user.name || '❌ 未设置') +
              '</td></tr>';

            const role = session.user.role;
            const roleStatus =
              role === 'admin' ? 'status-success' : 'status-warning';
            html +=
              '<tr><td><strong>角色:</strong></td><td>' +
              (role || '❌ 未设置') +
              '<span class="status-badge ' +
              roleStatus +
              '">' +
              (role || 'NONE') +
              '</span></td></tr>';

            const status = session.user.status;
            const statusClass =
              status === 'active' ? 'status-success' : 'status-error';
            html +=
              '<tr><td><strong>状态:</strong></td><td>' +
              (status || '❌ 未设置') +
              '<span class="status-badge ' +
              statusClass +
              '">' +
              (status || 'NONE') +
              '</span></td></tr>';
            html += '</table>';
          }

          html += '<h3 style="margin-top: 20px;">原始 JSON:</h3>';
          html += '<pre>' + JSON.stringify(session, null, 2) + '</pre>';

          resultDiv.innerHTML = html;

          // 自动运行诊断
          runDiagnostics(session);
        } catch (error) {
          resultDiv.innerHTML =
            '<p class="error">❌ 检查失败: ' + error.message + '</p>';
        }
      }

      async function testPermissions() {
        const resultDiv = document.getElementById('permissionResult');
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = '<p>⏳ 正在测试...</p>';

        try {
          const response = await fetch('/api/auth/session');
          const session = await response.json();

          let html = '<h3>权限测试结果:</h3>';

          if (!session || !session.user) {
            html += '<p class="error">❌ 无法测试权限: 未登录</p>';
          } else {
            const role = session.user.role;

            // 模拟权限检查逻辑
            const adminPermissions = [
              'inventory:inbound',
              'inventory:outbound',
              'inventory:view',
              'inventory:manage',
              'finance:view',
              'finance:manage',
            ];

            const warehousePermissions = [
              'inventory:inbound',
              'inventory:outbound',
              'inventory:view',
              'inventory:manage',
            ];

            const salesPermissions = ['inventory:view'];

            let userPermissions = [];
            if (role === 'admin') {
              userPermissions = adminPermissions;
            } else if (role === 'warehouse') {
              userPermissions = warehousePermissions;
            } else if (role === 'sales') {
              userPermissions = salesPermissions;
            }

            const hasInboundPermission =
              userPermissions.includes('inventory:inbound');

            html += '<p><strong>当前角色:</strong> ' + role + '</p>';
            html += '<p><strong>inventory:inbound 权限:</strong> ';

            if (hasInboundPermission) {
              html += '<span class="success">✅ 有权限</span>';
              html += '<p class="success">✅ "新增入库"按钮应该显示</p>';
            } else {
              html += '<span class="error">❌ 无权限</span>';
              html += '<p class="error">❌ "新增入库"按钮不会显示</p>';
            }

            html += '<h4 style="margin-top: 15px;">该角色的所有权限:</h4>';
            html += '<ul>';
            userPermissions.forEach(perm => {
              const highlight =
                perm === 'inventory:inbound'
                  ? ' style="color: #4CAF50; font-weight: bold;"'
                  : '';
              html += '<li' + highlight + '>' + perm + '</li>';
            });
            html += '</ul>';
          }

          resultDiv.innerHTML = html;
        } catch (error) {
          resultDiv.innerHTML =
            '<p class="error">❌ 测试失败: ' + error.message + '</p>';
        }
      }

      function runDiagnostics(session) {
        const diagnosticsDiv = document.getElementById('diagnostics');
        diagnosticsDiv.style.display = 'block';

        let html = '<h3>🔍 诊断结果:</h3>';
        let issues = [];
        let suggestions = [];

        // 检查 1: Session 是否存在
        if (!session || !session.user) {
          issues.push('❌ Session 不存在或无效');
          suggestions.push('重新登录系统');
          suggestions.push('检查浏览器 cookies 是否被禁用');
          suggestions.push('检查 NEXTAUTH_SECRET 环境变量是否配置');
        } else {
          // 检查 2: 角色是否为 admin
          if (session.user.role !== 'admin') {
            issues.push(
              '⚠️  当前角色不是 admin (当前: ' + session.user.role + ')'
            );
            suggestions.push('使用 admin 账号登录');
            suggestions.push('或者在数据库中将当前用户的 role 改为 admin');
          } else {
            issues.push('✅ 角色正确: admin');
          }

          // 检查 3: 状态是否为 active
          if (session.user.status !== 'active') {
            issues.push(
              '⚠️  用户状态不是 active (当前: ' + session.user.status + ')'
            );
            suggestions.push('在数据库中将用户状态改为 active');
          } else {
            issues.push('✅ 用户状态正常: active');
          }

          // 检查 4: 必要字段是否存在
          if (!session.user.id) {
            issues.push('❌ 缺少用户 ID');
            suggestions.push('检查 NextAuth 配置中的 session 回调');
          }
          if (!session.user.username) {
            issues.push('❌ 缺少用户名');
            suggestions.push('检查 NextAuth 配置中的 session 回调');
          }
        }

        // 显示问题
        html += '<div style="margin: 15px 0;">';
        issues.forEach(issue => {
          html += '<p>' + issue + '</p>';
        });
        html += '</div>';

        // 显示建议
        if (suggestions.length > 0) {
          html += '<h4>💡 建议:</h4>';
          html += '<ul>';
          suggestions.forEach(suggestion => {
            html += '<li>' + suggestion + '</li>';
          });
          html += '</ul>';
        }

        // 下一步操作
        html += '<h4 style="margin-top: 20px;">📝 下一步操作:</h4>';
        html += '<ol>';
        html +=
          '<li>如果所有检查都通过,访问 <a href="/inventory/inbound" target="_blank">/inventory/inbound</a></li>';
        html += '<li>打开浏览器开发者工具 (F12)</li>';
        html += '<li>查看 Console 标签中的日志</li>';
        html += '<li>查找 "🐛 [InboundRecordsToolbar]" 开头的日志</li>';
        html +=
          '<li>如果仍然看不到按钮,检查 Elements 标签中是否存在"新增入库"文本</li>';
        html += '</ol>';

        diagnosticsDiv.innerHTML = html;
      }

      // 页面加载时自动检查
      window.addEventListener('load', () => {
        console.log('🐛 Session 调试工具已加载');
        console.log('💡 提示: 点击"检查 Session"按钮开始诊断');
      });
    </script>
  </body>
</html>
